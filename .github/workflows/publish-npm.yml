name: Publish to npm

# Called by release-please.yml when a release has just been created. It is not meant to run by hand:
# the version published is the one in the tagged commit, and it must equal the tag.
# npm Trusted Publishing validates the *calling* workflow, so the trusted publisher on npmjs.com is
# configured for release-please.yml (see deploy/README.md).

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to publish, for example v0.2.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing (OIDC) and build provenance
    defaults:
      run:
        working-directory: server/control-plane
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: server/control-plane/package-lock.json
      # Trusted Publishing needs npm 11.5.1 or newer; Node 22 ships an older npm.
      - run: npm install -g npm@^11.5.1

      - name: Tag must equal the package version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json version $VERSION; nothing was published."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Pack, inspect and start the package
        run: npm run smoke

      - name: Skip if this version is already on npm
        id: exists
        run: |
          NAME=$(node -p "require('./package.json').name")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already published; nothing to do."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.exists.outputs.published == 'false'
        run: |
          case "$VERSION" in
            *-*) DIST_TAG=next ;;   # a pre-release never becomes "latest"
            *) DIST_TAG=latest ;;
          esac
          npm publish --provenance --access public --tag "$DIST_TAG"
          echo "DIST_TAG=$DIST_TAG" >> "$GITHUB_ENV"

      - name: Confirm the registry reports the new version
        if: steps.exists.outputs.published == 'false'
        run: |
          # The registry's read side can lag the publish by a few minutes (v0.2.0 was published
          # but still reported 0.1.0 as latest after one minute), so poll for up to five.
          NAME=$(node -p "require('./package.json').name")
          for i in $(seq 1 30); do
            GOT=$(npm view --prefer-online "$NAME" "dist-tags.$DIST_TAG" 2>/dev/null || true)
            if [ "$GOT" = "$VERSION" ]; then echo "$NAME@$DIST_TAG is $VERSION"; exit 0; fi
            sleep 10
          done
          echo "::error::npm does not report $VERSION under $DIST_TAG after 5 minutes (got '$GOT'). The publish step succeeded; check the package page before re-running."
          exit 1

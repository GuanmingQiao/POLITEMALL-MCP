services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - PUBLIC_HOST=${PUBLIC_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - control-plane

  control-plane:
    build: ./control-plane
    restart: unless-stopped
    environment:
      - PORT=3000
      - AWS_REGION=ap-southeast-1
      - MASTER_KEY_SECRET_ID=politemall-mcp/master-key
      - PUBLIC_ORIGIN=https://${PUBLIC_HOST}
      - USERS_FILE=/data/users.json
      - STORE_FILE=/data/sessions.json
      - RATE_LIMIT_PER_MINUTE=30
    volumes:
      - ./data:/data

volumes:
  caddy_data:
  caddy_config:

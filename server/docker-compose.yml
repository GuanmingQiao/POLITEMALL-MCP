networks:
  politemall-net:
    external: true

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - PUBLIC_HOST=${PUBLIC_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - politemall-net
    depends_on:
      - control-plane

  control-plane:
    build: ./control-plane
    restart: unless-stopped
    environment:
      - PORT=3000
      - AWS_REGION=ap-southeast-1
      - MASTER_KEY_SECRET_ID=politemall-mcp/master-key
      - DOCKER_NETWORK=politemall-net
      - LOGIN_SESSION_IMAGE=politemall-mcp-login-session:latest
      - PUBLIC_ORIGIN=https://${PUBLIC_HOST}
      - CONTROL_PLANE_INTERNAL_URL=http://control-plane:3000
      - USERS_FILE=/data/users.json
      - STORE_FILE=/data/sessions.json
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/data
    networks:
      - politemall-net

volumes:
  caddy_data:
  caddy_config:
